# $schema:https://json.schemastore.org/github-action.json
name: "Create index pages for a melange package repo"
description: "Create index pages for a melange package repo"

inputs:
  repo-dir:
    description: "Path to the melange package repo"
    required: true

runs:
  using: "composite"

  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version-file: "${{ github.action_path }}/.tool-versions"
        ignore-empty-workdir: "true"
        cache-dependency-glob: |
          ${{ github.action_path }}/**/*.py.lock

    - name: Generate index pages
      shell: bash
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
      run: |
        set -euo pipefail

        uv run --locked --script "${GITHUB_ACTION_PATH}/generate-index-pages.py" "${REPO_DIR}"

